name: a11ign

on:
  pull_request:
  workflow_dispatch:

jobs:
  a11ign:
    runs-on: windows-2022        # NVDA is Windows-only; the action fails fast anywhere else
    permissions:
      contents: read
      pull-requests: write       # for the PR comment below; omit it and the report still runs, only quieter
    steps:
      - uses: actions/checkout@v4
      - uses: DanBeckDev/a11y-witness@main
        # Pin it: @main moves under you. Use the full commit SHA if your CI must not change.
        id: a11ign
        with:
          url: https://www.w3.org/WAI
          task: Learn about web accessibility
      # NOT FROM THE DOCS - my own extra step, rehearsal run 2. The docs say the report is "in the
      # run's job summary", but a job summary is not exposed by the REST API or by `gh run view`,
      # so with no browser I cannot read it. This prints it into the log instead.
      - name: "(not from the docs) echo the job summary into the log"
        if: always()
        shell: bash
        run: |
          echo "--- RUNNER_TEMP/a11ign-summary.md ---"
          cat "$RUNNER_TEMP/a11ign-summary.md" || echo "(not found)"
          echo "--- runner step_summary files ---"
          for f in "$RUNNER_TEMP"/_runner_file_commands/step_summary_*; do
            [ -s "$f" ] || continue
            echo "== $f =="
            cat "$f"
          done
      # Keep the evidence: the full result, including the transcript behind every finding. Guarded on the
      # output existing, so a run that failed does not also fail the upload.
      - uses: actions/upload-artifact@v4
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn
