name: a11ign

on:
  pull_request:
  workflow_dispatch:

jobs:
  a11ign:
    runs-on: windows-2022        # NVDA is Windows-only; the action fails fast anywhere else
    permissions:
      contents: read
      pull-requests: write       # for the PR comment below; omit it and the report still runs, only quieter
    steps:
      - uses: actions/checkout@v4
      - uses: DanBeckDev/a11y-witness@main
        # Pin it: @main moves under you. Use the full commit SHA if your CI must not change.
        id: a11ign
        with:
          url: https://www.w3.org/WAI
          task: Learn about web accessibility
      # ---- NOT FROM THE DOCUMENTATION. My own step, added for rehearsal run 2. ----
      # docs/try-it.md:73 and docs/github-action.md:94 both say that on a run started by hand
      # "the report is in the run's job summary". A job summary is not exposed by the REST API,
      # by `gh run view`, by `gh run view --log`, by the run's artifact list, or by the job's
      # check-run output -- all five checked after run 1. With no browser I cannot read the one
      # artefact the documents point me at, so this prints it into the log instead. The path
      # comes from run 1's own log, where the action's Report step passes --summary-out.
      - name: "NOT FROM THE DOCS - print the job summary into the log"
        if: always()
        shell: bash
        run: |
          echo "===== BEGIN a11ign job summary ====="
          cat "$RUNNER_TEMP/a11ign-summary.md" 2>/dev/null || echo "(no file at RUNNER_TEMP/a11ign-summary.md)"
          echo "===== END a11ign job summary ====="
      # Keep the evidence: the full result, including the transcript behind every finding. Guarded on the
      # output existing, so a run that failed does not also fail the upload.
      - uses: actions/upload-artifact@v4
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn
